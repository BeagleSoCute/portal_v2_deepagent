[project]
name = "agent-builder"
version = "0.1.0"
description = "Build and tune DeepAgents from a form, as an app behind the Portal"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.5.3",
    "langchain>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "langchain-openai>=1.6.0",
    "fpdf>=1.7.2",
    "authlib>=1.6",
    "joserfc>=1.8",
    "cryptography>=45",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
openai = ["langchain-openai>=0.2.0"]
google = ["langchain-google-genai>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
